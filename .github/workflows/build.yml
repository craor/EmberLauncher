name: Check and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libxcb-cursor0 libnss3 libxcomposite1 libxrandr2 libxi6 libxtst6 \
            || sudo apt-get install -y libegl1 libgl1 libglib2.0-0t64 libdbus-1-3 libxkbcommon0 libxcb-cursor0 libnss3 libxcomposite1 libxrandr2 libxi6 libxtst6
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile launcher.py build_release.py make_icon.py tests/test_core.py ember_src/part_01.py ember_src/part_01b.py ember_src/part_01c.py ember_src/part_02.py ember_src/part_02b.py ember_src/part_02c.py ember_src/part_02d.py ember_src/part_03.py ember_src/part_04.py ember_src/part_05.py
      - name: Safety checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_core.py

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: EmberLauncher.exe
          - os: ubuntu-22.04
            artifact: EmberLauncher-linux
          - os: macos-15
            artifact: EmberLauncher-macOS.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libxcb-cursor0 libnss3 libxcomposite1 libxrandr2 libxi6 libxtst6 libasound2 \
            || sudo apt-get install -y libegl1 libgl1 libglib2.0-0t64 libdbus-1-3 libxkbcommon0 libxcb-cursor0 libnss3 libxcomposite1 libxrandr2 libxi6 libxtst6 libasound2t64
      - name: Install
        run: pip install -r requirements.txt "pyinstaller>=6.0"
      - name: Build
        run: python build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: EmberLauncher-macOS.zip
          path: dist/EmberLauncher-macOS.zip
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import re; t=open("launcher.py",encoding="utf-8").read(); m=re.search("APP_VERSION = .([0-9.]+).", t); assert m, "APP_VERSION not found"; open("version.txt","w",encoding="utf-8").write(m.group(1))'
          TAG="v$(tr -d "\r" < version.txt)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            "artifacts/EmberLauncher.exe/EmberLauncher.exe" \
            "artifacts/EmberLauncher-linux/EmberLauncher-linux" \
            "artifacts/EmberLauncher-macOS.dmg/EmberLauncher-macOS.dmg" \
            "artifacts/EmberLauncher-macOS.zip/EmberLauncher-macOS.zip" \
            --title "$TAG" \
            --notes "Светлое стекло: большие скругления, белые карточки, горы на фоне и фиолетовая кнопка «Играть». Окно, вкладки и подпись версии появляются мягко, кнопка запуска слегка дышит. Онлайн сервера на месте: адрес слева, отдельный сайт не нужен."
